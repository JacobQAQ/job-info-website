# 扩展配置文件 - 根路径部署方案
# 文件位置：/www/server/panel/vhost/nginx/extension/starterhunt.asia/job-info.conf
# 访问路径：http://starterhunt.asia/
# 
# ⚠️ 重要：此文件会被自动包含到主配置中，无需修改主配置文件
# 使用方法：在宝塔面板 → 网站 → starterhunt.asia → 设置 → 扩展配置 中添加
# 
# ⚠️ 注意：如果使用根路径部署，需要确保主配置的 root 指向正确路径
# 或者使用 location / 覆盖主配置的 root 设置

# 前端静态文件 - 根路径访问（优先级高于主配置的 location /）
location = / {
    try_files /job-info/frontend/dist/index.html /index.html;
}

location / {
    root /www/wwwroot/starterhunt.asia/job-info/frontend/dist;
    try_files $uri $uri/ /index.html;
    
    # 禁止访问敏感文件（与主配置保持一致）
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.git|node_modules) {
        return 404;
    }
}

# 后端 API 代理 - 根路径访问
location /api {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# 静态资源缓存优化（覆盖主配置的缓存设置）
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}
