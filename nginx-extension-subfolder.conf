# 扩展配置文件 - 子路径部署方案
# 文件位置：/www/server/panel/vhost/nginx/extension/starterhunt.asia/job-info.conf
# 访问路径：http://starterhunt.asia/job-info/
# 
# ⚠️ 重要：此文件会被自动包含到主配置中，无需修改主配置文件
# 使用方法：在宝塔面板 → 网站 → starterhunt.asia → 设置 → 扩展配置 中添加

# 后端 API 代理 - 子路径访问（必须在 /job-info/ 之前，优先级更高）
location /job-info/api {
    rewrite ^/job-info/api(.*)$ /api$1 break;
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# 前端静态文件 - 子路径访问（处理所有 /job-info/ 下的请求）
location /job-info/ {
    alias /www/wwwroot/starterhunt.asia/job-info/frontend/dist/;
    try_files $uri $uri/ /job-info/index.html;
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 禁止访问敏感文件（与主配置保持一致）
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.git|node_modules) {
        return 404;
    }
}
